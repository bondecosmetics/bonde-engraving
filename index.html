  :root{
    --page-bg:#EAF1FC;
    --walnut:#2B241C;
    --stone:#8A8580;
    --line:#D9CDB2;
    --brand-blue:#22398C;
    --brand-blue-bg:#EAF1FC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--walnut);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  header{
    padding:36px 24px 20px;
    text-align:center;
  }
  header h1{
    font-family:'Prata', serif;
    font-size:clamp(22px, 4vw, 30px);
    letter-spacing:0.03em;
    margin:0 0 6px;
    color:var(--brand-blue);
  }
  header p{
    margin:0;
    color:var(--stone);
    font-size:14px;
  }
  .layout{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:28px;
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 56px;
  }
  @media (max-width:800px){
    .layout{grid-template-columns:1fr; padding:0 16px 40px;}
    .preview-wrap{order:-1;}
  }
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px;
  }
  .panel + .panel{margin-top:18px;}
  .panel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--brand-blue);
    margin:0 0 12px;
    font-weight:600;
  }
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--stone);
    margin-bottom:6px;
  }
  input[type="text"]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:15px;
    font-family:inherit;
    color:var(--walnut);
    background:var(--page-bg);
  }
  input[type="text"]:focus{
    outline:2px solid var(--brand-blue);
    outline-offset:1px;
  }
  .hint{font-size:12px; color:var(--stone); margin-top:6px;}

  .font-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .font-option{
    text-align:left;
    background:var(--page-bg);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px;
    cursor:pointer;
    font-size:21px;
    color:var(--walnut);
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
  }
  .font-option .fname{
    font-family:'Work Sans', sans-serif;
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--stone);
    white-space:nowrap;
    margin-left:10px;
  }
  .font-option:hover{border-color:var(--brand-blue);}
  .font-option[aria-pressed="true"]{
    border-color:var(--brand-blue);
    background:#EEF3FC;
    box-shadow:inset 0 0 0 1px var(--brand-blue);
  }

  .preview-wrap{
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .plaque{
    width:100%;
    max-width:520px;
    aspect-ratio:4/3;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    position:relative;
    background:#FFFFFF;
    border:1px solid var(--line);
    box-shadow:0 2px 14px rgba(43,36,28,0.08);
    overflow:hidden;
  }
  .text-slot{
    text-align:center;
    line-height:1.3;
    color:var(--brand-blue);
    white-space:nowrap;
  }
</style>
</head>

<div class="layout">
  <div class="controls">
    <div class="panel">
      <h2>Tên bạn</h2>
      <input type="text" id="textInput" maxlength="26" value="Bondé Cosmetics" placeholder="Nhập tên của bạn">
    </div>

    <div class="panel">
      <h2>Font</h2>
      <div class="font-list" id="fontList"></div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="plaque">
      <div class="text-slot" id="textSlot">Bondé Cosmetics</div>
    </div>
  </div>
</div>

<script>
  const fonts = [
    { name: "VNI Script", family: "'VNI-Script-Real', 'VSCRIPT0', 'Alex Brush', cursive", weight: 400 },
    { name: "VNI Commercial Script", family: "'VNI-Commerce-Real', 'vni.common.VCOMMERC', 'Petit Formal Script', cursive", weight: 400 },
    { name: "Hillda", family: "'VL Hillda', 'Sacramento', cursive", weight: 400 },
    { name: "UTM Aristote", family: "'UTM Aristote', 'Cormorant Garamond', serif", weight: 500 },
    { name: "Times New Roman", family: "'Times New Roman', Georgia, serif", weight: 400 },
    { name: "Helvetica", family: "'Helvetica Neue', Helvetica, Arial, sans-serif", weight: 500 },
    { name: "Wallbaum", family: "'Walbaum Com', 'Prata', serif", weight: 400 },
  ];

  const state = { font: 0 };

  const fontList = document.getElementById('fontList');
  fonts.forEach((f, i) => {
    const btn = document.createElement('button');
    btn.className = 'font-option';
    btn.setAttribute('aria-pressed', i === state.font ? 'true' : 'false');
    btn.style.fontFamily = f.family;
    btn.style.fontWeight = f.weight;
    if (f.style) btn.style.fontStyle = f.style;
    btn.innerHTML = `<span>${escapeHtml(document.getElementById('textInput').value || 'Aa')}</span><span class="fname">${i + 1} — ${f.name}</span>`;
    btn.addEventListener('click', () => {
      state.font = i;
      updateSelection(fontList, btn);
      render();
    });
    fontList.appendChild(btn);
  });

  document.getElementById('textInput').addEventListener('input', () => {
    const val = document.getElementById('textInput').value || 'Aa';
    Array.from(fontList.children).forEach(btn => {
      btn.querySelector('span').textContent = val;
    });
    render();
  });

  function updateSelection(container, activeEl){
    Array.from(container.children).forEach(el => el.setAttribute('aria-pressed', el === activeEl ? 'true' : 'false'));
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render(){
    const text = document.getElementById('textInput').value || 'Bondé Cosmetics';
    const f = fonts[state.font];
    const textSlot = document.getElementById('textSlot');
    textSlot.textContent = text;
    textSlot.style.fontFamily = f.family;
    textSlot.style.fontWeight = f.weight;
    textSlot.style.fontStyle = f.style || 'normal';
    fitText();
  }

  function fitText(){
    const slot = document.getElementById('textSlot');
    const plaque = slot.parentElement;
    const maxWidth = plaque.clientWidth * 0.86;
    const maxHeight = plaque.clientHeight * 0.6;
    let size = 46;
    slot.style.fontSize = size + 'px';
    while (size > 12 && (slot.scrollWidth > maxWidth || slot.scrollHeight > maxHeight)) {
      size -= 1;
      slot.style.fontSize = size + 'px';
    }
  }

  window.addEventListener('resize', fitText);

  render();
</script>
